<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zhen Zhang · Research Hub</title>

<style>
:root{
  --blue:#1769e8;
  --blue-dark:#0b4fc7;
  --blue-soft:#eaf3ff;
  --blue-line:#d9e7fb;
  --ink:#13254a;
  --text:#24324a;
  --muted:#64748b;
  --bg:#f3f8ff;
  --white:#ffffff;
  --line:#e5edf6;
  --shadow:0 10px 28px rgba(33,72,125,.10);
  --shadow-soft:0 6px 18px rgba(33,72,125,.08);
  --max:1480px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",
              "PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0%, rgba(96,165,250,.14), transparent 28%),
    radial-gradient(circle at 86% 3%, rgba(59,130,246,.10), transparent 25%),
    linear-gradient(180deg,#f7fbff 0%,#eef6ff 100%);
}

button{font:inherit}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------------- Header ---------------- */
.hero{
  flex:none;
  position:relative;
  z-index:10;
  background:
    linear-gradient(180deg,rgba(248,252,255,.96),rgba(255,255,255,.94));
  border-bottom:1px solid rgba(203,219,239,.85);
  box-shadow:0 5px 18px rgba(53,88,138,.07);
  overflow:hidden;
}

.hero::before,
.hero::after{
  content:"";
  position:absolute;
  pointer-events:none;
  border-radius:50%;
  filter:blur(.2px);
}

.hero::before{
  width:420px;
  height:160px;
  left:-100px;
  top:-105px;
  background:rgba(88,153,255,.10);
  transform:rotate(-8deg);
}

.hero::after{
  width:360px;
  height:130px;
  right:-70px;
  top:-85px;
  background:rgba(120,175,255,.08);
}

.hero-inner{
  width:min(calc(100% - 44px),var(--max));
  margin:0 auto;
  position:relative;
  z-index:1;
}

.top-row{
  min-height:78px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:16px;
}

.brand{
  grid-column:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:0;
}

.brand-main{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  white-space:nowrap;
}

.cap-icon{
  width:34px;
  height:34px;
  color:var(--blue-dark);
  flex:none;
}

.brand-title{
  font-size:30px;
  line-height:1.1;
  font-weight:700;
  letter-spacing:-.25px;
  color:#10264f;
}

.workspace-badge{
  height:28px;
  display:inline-flex;
  align-items:center;
  padding:0 11px;
  border-radius:999px;
  background:linear-gradient(180deg,#dfeeff,#cfe4ff);
  border:1px solid #c4ddfb;
  color:#0d5ed7;
  font-size:12px;
  font-weight:700;
  letter-spacing:.1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
}

.brand-subtitle{
  margin-top:8px;
  color:#55719b;
  font-size:15px;
  font-weight:500;
  letter-spacing:.12px;
}

.toolbar{
  grid-column:3;
  justify-self:end;
  display:flex;
  align-items:center;
  gap:10px;
}

.tool-btn{
  height:44px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:0 14px;
  border:1px solid #e0e8f2;
  border-radius:14px;
  background:rgba(255,255,255,.92);
  color:#243656;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
  box-shadow:var(--shadow-soft);
  transition:all .16s ease;
}

.tool-btn:hover{
  color:var(--blue-dark);
  border-color:#c8daf1;
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(33,72,125,.11);
}

.tool-btn svg{
  width:20px;
  height:20px;
  stroke-width:2;
}

/* ---------------- Pill navigation ---------------- */
.nav-wrap{
  padding:2px 0 18px;
}

.nav-scroll{
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
}

.nav-scroll::-webkit-scrollbar{display:none}

.nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:max-content;
  min-width:100%;
  padding:0 4px;
}

.nav-btn{
  height:48px;
  flex:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:0 17px;
  border:1px solid #e1eaf5;
  border-radius:999px;
  background:rgba(255,255,255,.93);
  color:#172746;
  font-size:14.5px;
  font-weight:680;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:
    0 4px 12px rgba(49,83,131,.07),
    inset 0 1px 0 rgba(255,255,255,.78);
  transition:all .16s ease;
}

.nav-btn:hover{
  color:#0f5ed2;
  border-color:#c8ddf7;
  background:#fbfdff;
  transform:translateY(-1px);
  box-shadow:0 7px 17px rgba(49,83,131,.10);
}

.nav-btn.active{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(180deg,#2b79ed,#1262df);
  box-shadow:
    0 8px 18px rgba(23,105,232,.23),
    inset 0 1px 0 rgba(255,255,255,.22);
}

.nav-icon{
  width:21px;
  height:21px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.nav-icon svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  fill:none;
}

.external-mark{
  width:14px;
  height:14px;
  margin-left:-2px;
  opacity:.72;
}

.nav-btn.active .external-mark{opacity:.95}

/* ---------------- Content ---------------- */
.content-area{
  flex:1;
  min-height:0;
  padding:18px 20px 20px;
}

.content-shell{
  width:min(100%,var(--max));
  height:100%;
  margin:0 auto;
  position:relative;
  border:1px solid #dbe8f6;
  border-radius:20px;
  background:rgba(255,255,255,.82);
  padding:10px;
  box-shadow:
    0 16px 38px rgba(44,79,129,.10),
    inset 0 1px 0 rgba(255,255,255,.85);
  overflow:hidden;
}

.iframe-frame{
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:14px;
  border:1px solid #e5edf6;
  background:#fff;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.loading{
  position:absolute;
  inset:10px;
  z-index:5;
  display:none;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:rgba(250,253,255,.92);
  backdrop-filter:blur(2px);
}

.loading.show{display:flex}

.loading-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border:1px solid #dfeaf6;
  border-radius:14px;
  background:#fff;
  color:#49617f;
  font-size:14px;
  box-shadow:var(--shadow-soft);
}

.spinner{
  width:20px;
  height:20px;
  border:2px solid #d7e7fa;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .75s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- Responsive ---------------- */
@media (max-width:1180px){
  .hero-inner{
    width:min(calc(100% - 24px),var(--max));
  }

  .top-row{
    grid-template-columns:1fr auto;
  }

  .brand{
    grid-column:1;
    align-items:flex-start;
  }

  .brand-main{
    justify-content:flex-start;
  }

  .toolbar{
    grid-column:2;
  }

  .brand-title{font-size:25px}

  .nav{
    justify-content:flex-start;
    min-width:max-content;
  }

  .nav-btn{
    height:46px;
    font-size:14px;
    padding:0 15px;
  }
}

@media (max-width:760px){
  .top-row{
    min-height:66px;
    grid-template-columns:1fr auto;
    gap:8px;
  }

  .cap-icon{
    width:27px;
    height:27px;
  }

  .brand-main{gap:8px}
  .brand-title{font-size:19px}
  .workspace-badge{display:none}
  .toolbar{gap:5px}

  .tool-btn{
    width:38px;
    height:38px;
    padding:0;
    justify-content:center;
    border-radius:12px;
  }

  .tool-btn span{display:none}
  .tool-btn svg{width:18px;height:18px}

  .nav-wrap{padding-bottom:12px}

  .nav-btn{
    height:42px;
    gap:7px;
    padding:0 13px;
    font-size:13px;
  }

  .nav-icon,
  .nav-icon svg{
    width:19px;
    height:19px;
  }

  .content-area{
    padding:10px 8px 9px;
  }

  .content-shell{
    padding:5px;
    border-radius:14px;
  }

  .iframe-frame,
  .loading{
    border-radius:10px;
  }

  .loading{inset:5px}
}

@media (max-width:480px){
  .hero-inner{width:calc(100% - 16px)}
  .brand-title{font-size:16.5px}
  .brand-subtitle{display:none}
  .cap-icon{width:24px;height:24px}
  .top-row{min-height:58px}
}
</style>
</head>

<body>
<div class="app">

  <header class="hero">
    <div class="hero-inner">

      <div class="top-row">
        <div></div>

        <div class="brand">
          <div class="brand-main">
            <svg class="cap-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 3 1.8 8.2 12 13.4l8.2-4.18V15h1.6V8.2L12 3Zm-6.9 8.3v4.45c0 2.1 3.12 3.8 6.9 3.8s6.9-1.7 6.9-3.8V11.3L12 14.8l-6.9-3.5Z"/>
            </svg>
            <div class="brand-title">Zhen Zhang · Research Hub</div>
            <div class="workspace-badge">Research Workspace</div>
          </div>
        </div>

        <div class="toolbar">
          <button class="tool-btn" id="refreshBtn" title="刷新当前页面">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 11a8 8 0 0 0-14.7-4.4L3 9"/>
              <path d="M3 4v5h5"/>
              <path d="M4 13a8 8 0 0 0 14.7 4.4L21 15"/>
              <path d="M21 20v-5h-5"/>
            </svg>
            <span>刷新</span>
          </button>

          <button class="tool-btn" id="openBtn" title="在新窗口打开当前页面">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M14 3h7v7"/>
              <path d="M10 14 21 3"/>
              <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
            </svg>
            <span>新窗口</span>
          </button>

          <button class="tool-btn" id="fullBtn" title="全屏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M8 3H3v5"/>
              <path d="M16 3h5v5"/>
              <path d="M8 21H3v-5"/>
              <path d="M16 21h5v-5"/>
            </svg>
            <span>全屏</span>
          </button>
        </div>
      </div>

      <div class="nav-wrap">
        <div class="nav-scroll">
          <nav class="nav" id="nav"></nav>
        </div>
      </div>

    </div>
  </header>

  <main class="content-area">
    <div class="content-shell">
      <div class="loading" id="loading">
        <div class="loading-card">
          <div class="spinner"></div>
          <span>正在加载页面…</span>
        </div>
      </div>

      <div class="iframe-frame">
        <iframe
          id="viewer"
          title="Research Hub Viewer"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="clipboard-read; clipboard-write; fullscreen">
        </iframe>
      </div>
    </div>
  </main>
</div>

<script>
const ICONS = {
  home: `
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M9 20v-6h6v6"/></svg>`,
  monitor: `
    <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M9 20V5"/><path d="M14 20v-8"/><path d="M19 20V7"/><path d="M2 20h20"/></svg>`,
  list: `
    <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`,
  compass: `
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"/></svg>`,
  send: `
    <svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></svg>`,
  journal: `
    <svg viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 0 1 2 2v14H8a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1Z"/><path d="M8 4v16"/><path d="M11 8h5M11 12h5"/></svg>`,
  award: `
    <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="m8.5 13-2 8 5.5-3 5.5 3-2-8"/></svg>`,
  clean: `
    <svg viewBox="0 0 24 24"><path d="M5 4h14v16l-7-3-7 3V4Z"/><path d="M8.5 9.5 11 12l4.5-5"/></svg>`,
  sparkle: `
    <svg viewBox="0 0 24 24"><path d="M12 3 13.6 7.4 18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></svg>`,
  external: `
    <svg viewBox="0 0 24 24"><path d="M14 5h5v5"/><path d="m19 5-8 8"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>`
};

const pages = [
  { id:"home",       name:"个人主页",            icon:"home",    url:"https://dm-dut.github.io/" },
  { id:"paper",      name:"Paper Monitor",      icon:"monitor", url:"https://dm-dut.github.io/paper-monitor" },
  { id:"journal",    name:"期刊导航",            icon:"compass", url:"https://dm-dut.github.io/journal/" },
  { id:"submission", name:"投稿系统",            icon:"send",    url:"https://dm-dut.github.io/submission_system/" },
  { id:"journals",   name:"期刊列表",            icon:"list",    url:"https://dm-dut.github.io/journal_list" },
  { id:"dufe",       name:"DUFE Journal",       icon:"journal", url:"https://dm-dut.github.io/dufe_journal" },
  { id:"award",      name:"Award",              icon:"award",   url:"https://dm-dut.github.io/Award" },
  { id:"reference",  name:"Reference Cleaner",  icon:"clean",   url:"https://reference-cleaner.streamlit.app", external:true },
  { id:"response",   name:"Response Generator", icon:"sparkle", url:"https://response-generator.streamlit.app", external:true }
];

const nav = document.getElementById("nav");
const viewer = document.getElementById("viewer");
const loading = document.getElementById("loading");

let current = null;

function showLoading(){
  loading.classList.add("show");
  setTimeout(()=>loading.classList.remove("show"),5000);
}

function updateActive(id){
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.id===id);
  });
}

function openPage(id,pushHash=true){
  const page = pages.find(p=>p.id===id && !p.external) || pages[0];
  current = page;
  updateActive(page.id);
  showLoading();
  viewer.src = page.url;
  localStorage.setItem("researchHubPage",page.id);

  if(pushHash && location.hash !== "#" + page.id){
    history.replaceState(null,"","#"+page.id);
  }
}

pages.forEach(page=>{
  const btn = document.createElement("button");
  btn.className = "nav-btn";
  btn.dataset.id = page.id;

  const icon = document.createElement("span");
  icon.className = "nav-icon";
  icon.innerHTML = ICONS[page.icon];

  const label = document.createElement("span");
  label.textContent = page.name;

  btn.appendChild(icon);
  btn.appendChild(label);

  if(page.external){
    const mark = document.createElement("span");
    mark.className = "external-mark";
    mark.innerHTML = ICONS.external;
    btn.appendChild(mark);
    btn.title = "在新窗口打开";
  }

  btn.addEventListener("click",()=>{
    if(page.external){
      window.open(page.url,"_blank","noopener,noreferrer");
      return;
    }
    openPage(page.id);
  });

  nav.appendChild(btn);
});

viewer.addEventListener("load",()=>{
  loading.classList.remove("show");
});

document.getElementById("refreshBtn").addEventListener("click",()=>{
  if(!current) return;
  showLoading();
  viewer.src = current.url;
});

document.getElementById("openBtn").addEventListener("click",()=>{
  if(current){
    window.open(current.url,"_blank","noopener,noreferrer");
  }
});

document.getElementById("fullBtn").addEventListener("click",async()=>{
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(e){}
});

window.addEventListener("hashchange",()=>{
  const id = location.hash.replace("#","");
  if(pages.some(p=>p.id===id && !p.external)){
    openPage(id,false);
  }
});

const hashId = location.hash.replace("#","");
const savedId = localStorage.getItem("researchHubPage");
const embeddable = id => pages.some(p=>p.id===id && !p.external);

const initialId =
  embeddable(hashId) ? hashId :
  embeddable(savedId) ? savedId :
  "home";

openPage(initialId,false);
</script>

</body>
</html>

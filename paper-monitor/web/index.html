
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Paper Monitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="header-inner">
<div>
<h1>Paper Monitor</h1>
<div class="subtitle">Journal Update Monitoring System</div>
</div>
<div class="update">
Last Update: <strong id="updateTime">--</strong> (UTC+8)
</div>
</div>
</header>

<div class="container">
<div class="toolbar">
<input id="searchBox" placeholder="Search title, author, DOI">

<select id="categorySelect">
<option value="All">All Categories</option>
</select>

<select id="journalSelect">
<option value="All">All Journals</option>
</select>

<select id="sortBox">
<option value="date">Sort by Date</option>
<option value="journal">Sort by Journal</option>
</select>
</div>

<div class="summary" id="summary"></div>
<div id="paperList"></div>
</div>

<script src="app.js"></script>
</body>
</html>

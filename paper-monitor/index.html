
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Paper Monitor</title>
<link rel="stylesheet" href="web/style.css?v=14.3">
</head>
<body>

<header>
<div class="header-inner">
<div>
<h1>Paper Monitor</h1>
<div class="subtitle">Journal Update Monitoring System</div>
</div>
<div class="update">
Last Update: <strong id="updateTime">--</strong> (UTC+8)
</div>
</div>
</header>

<div class="container">

<div class="toolbar">
<input id="searchBox" placeholder="Search title, author, DOI">

<select id="categorySelect">
<option value="All">All Categories</option>
</select>

<select id="journalSelect">
<option value="All">All Journals</option>
</select>

<select id="sortBox">
<option value="date">Sort by Date</option>
<option value="journal">Sort by Journal</option>
</select>
</div>

<div id="summary" class="summary"></div>
<div id="paperList"></div>

<div id="pagination" class="pagination"></div>

<footer>
Copyright © 2026 Zhen Zhang, Dalian University of Technology
</footer>

</div>

<script src="web/app.js?v=14.3"></script>
</body>
</html>

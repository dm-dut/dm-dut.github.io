<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Online Papers</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div>
        <div class="eyebrow">LATEST ONLINE PAPERS</div>
        <h1>最新在线论文</h1>
        <p>ScienceDirect · Springer Nature · IEEE</p>
      </div>
      <div class="update-panel">
        <div id="stats" class="stats"></div>
        <button id="refreshButton" class="refresh-button" type="button">
          <span class="refresh-icon" aria-hidden="true">↻</span>
          <span id="refreshButtonText">立即更新</span>
        </button>
        <div id="refreshStatus" class="refresh-status" aria-live="polite"></div>
      </div>
    </header>

    <section class="toolbar">
      <div id="publisherTabs" class="tabs"></div>
      <div class="controls">
        <select id="rangeSelect" aria-label="日期范围">
          <option value="7">最近 7 天</option>
          <option value="30" selected>最近 30 天</option>
          <option value="90">最近 90 天</option>
          <option value="365">最近 1 年</option>
          <option value="all">全部</option>
        </select>
        <input id="searchInput" type="search" placeholder="检索标题 / 期刊 / 作者" />
      </div>
    </section>

    <section id="paperList" class="paper-list"></section>
    <div id="empty" class="empty" hidden>没有符合条件的论文。</div>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

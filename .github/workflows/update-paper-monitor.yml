name: Update paper monitor

on:
  workflow_dispatch:
  schedule:
    # Approximately every two days at 02:17 UTC.
    - cron: "17 2 */2 * *"

concurrency:
  group: paper-monitor-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper_monitor_system/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r paper_monitor_system/requirements.txt

      - name: Validate package, hybrid sources and whitelist
        run: |
          python -m paper_monitor_system.app.selfcheck
          python -m paper_monitor_system.app.selftest

      - name: Check Springer Meta API secret without printing it
        env:
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          value = os.getenv("SPRINGER_API_KEY", "")
          print(f"SPRINGER_API_KEY: {'present' if value else 'missing'}; length={len(value)}")
          if not value:
              raise SystemExit("SPRINGER_API_KEY is required for the primary Springer Meta API path")
          PY

      - name: Fetch and export papers
        env:
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          ENABLE_SCIENCEDIRECT_API: "false"
          ENABLE_SPRINGER_API: "true"
          ENABLE_IEEE_API: "false"
          ENABLE_CROSSREF_FALLBACK: "true"
          OVERLAP_DAYS: "3"
          EXPORT_DAYS: "365"
          REQUEST_PAUSE_SECONDS: "0.35"
        run: python -m paper_monitor_system.app.sync --provider all --initial-days 7

      - name: Publish generated monitor data without rebasing binary files
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          test -f paper-monitor/data/online_papers.json
          test -f paper_monitor_system/data/papers.db
          cp paper-monitor/data/online_papers.json "$TMP_DIR/online_papers.json"
          cp paper_monitor_system/data/papers.db "$TMP_DIR/papers.db"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never rebase/merge the SQLite DB or generated JSON. If the homepage
          # changes during the run, reset to the newest remote main and restore
          # only the two generated paper-monitor data files.
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            mkdir -p paper-monitor/data paper_monitor_system/data
            cp "$TMP_DIR/online_papers.json" paper-monitor/data/online_papers.json
            cp "$TMP_DIR/papers.db" paper_monitor_system/data/papers.db

            git add paper-monitor/data/online_papers.json paper_monitor_system/data/papers.db
            if git diff --cached --quiet; then
              echo "No paper-monitor data changes to publish."
              exit 0
            fi

            git commit -m "chore: update paper monitor"
            if git push origin "HEAD:$BRANCH"; then
              echo "Paper-monitor data published successfully."
              exit 0
            fi

            echo "Remote branch changed during publish; retrying from latest origin/$BRANCH ..."
            sleep $((attempt * 2))
          done

          echo "Failed to publish paper-monitor data after 3 attempts."
          exit 1

name: update-paper-monitor

name: update

on:
  schedule:
    # 07:30 Beijing time (UTC+8)
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas PyYAML openpyxl

      - name: Update papers
        run: python scripts/update.py

      - name: Generate email digest
        run: python scripts/generate_email.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add web database logs
          git commit -m "Update papers automatically" || echo "No changes"
          git push

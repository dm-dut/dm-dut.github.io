name: Update paper monitor

on:
  workflow_dispatch:
  schedule:
    # Runs approximately every two days at 02:17 UTC.
    - cron: "17 2 */2 * *"

concurrency:
  group: paper-monitor-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper_monitor_system/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r paper_monitor_system/requirements.txt

      - name: Validate package, paths and whitelist
        run: |
          python -m paper_monitor_system.app.selfcheck
          python -m paper_monitor_system.app.selftest

      - name: Check API secrets without printing them
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INSTTOKEN: ${{ secrets.ELSEVIER_INSTTOKEN }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          for name in ("ELSEVIER_API_KEY", "SPRINGER_API_KEY", "IEEE_API_KEY"):
              value = os.getenv(name, "")
              print(f"{name}: {'present' if value else 'missing'}; length={len(value)}")
          inst = os.getenv("ELSEVIER_INSTTOKEN", "")
          print(f"ELSEVIER_INSTTOKEN: {'present' if inst else 'not configured (optional)'}")
          PY

      - name: Fetch and export papers
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INSTTOKEN: ${{ secrets.ELSEVIER_INSTTOKEN }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          ENABLE_CROSSREF_FALLBACK: "true"
          CROSSREF_DISCOVERY_DAYS: "30"
          OVERLAP_DAYS: "3"
          EXPORT_DAYS: "365"
          REQUEST_PAUSE_SECONDS: "0.60"
        run: python -m paper_monitor_system.app.sync --provider all --initial-days 7

      - name: Publish generated monitor data without rebasing binary files
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          test -f paper-monitor/data/online_papers.json
          test -f paper_monitor_system/data/papers.db
          cp paper-monitor/data/online_papers.json "$TMP_DIR/online_papers.json"
          cp paper_monitor_system/data/papers.db "$TMP_DIR/papers.db"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A homepage edit may land while this job is running. Do not merge or
          # rebase SQLite/JSON. On each attempt, reset to the newest remote main
          # and re-apply only the two generated monitor data files.
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            mkdir -p paper-monitor/data paper_monitor_system/data
            cp "$TMP_DIR/online_papers.json" paper-monitor/data/online_papers.json
            cp "$TMP_DIR/papers.db" paper_monitor_system/data/papers.db

            git add paper-monitor/data/online_papers.json paper_monitor_system/data/papers.db
            if git diff --cached --quiet; then
              echo "No paper-monitor data changes to publish."
              exit 0
            fi

            git commit -m "chore: update paper monitor"
            if git push origin "HEAD:$BRANCH"; then
              echo "Paper-monitor data published successfully."
              exit 0
            fi

            echo "Remote branch changed during publish; retrying from latest origin/$BRANCH ..."
            sleep $((attempt * 2))
          done

          echo "Failed to publish paper-monitor data after 3 attempts."
          exit 1

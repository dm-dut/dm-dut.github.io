name: Update paper monitor

on:
  workflow_dispatch:
  schedule:
    # Every two days at 02:17 UTC.
    - cron: "17 2 */2 * *"

concurrency:
  group: paper-monitor-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper_monitor_system/requirements.txt

      - name: Install dependencies
        run: pip install -r paper_monitor_system/requirements.txt

      - name: Fetch and export papers
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
          DATABASE_URL: sqlite:///paper_monitor_system/data/papers.db
          JOURNAL_LIST_PATH: paper_monitor_system/journal_list.xlsx
          OVERLAP_DAYS: "3"
          EXPORT_DAYS: "365"
        run: python -m paper_monitor_system.app.sync --provider all --initial-days 7

      - name: Commit paper-monitor data only
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_monitor_system/data/papers.db paper-monitor/data/online_papers.json
          if git diff --cached --quiet; then
            echo "No paper-monitor changes"
          else
            git commit -m "chore: update paper monitor"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

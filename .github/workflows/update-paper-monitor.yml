name: Paper monitor (local updater only)

# LOCAL_FINAL_V2: publisher fetching is intentionally NOT scheduled on GitHub-hosted
# runners. GitHub Pages remains the display layer; local update_papers.bat performs collection.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-mode-info:
    runs-on: ubuntu-latest
    steps:
      - name: Local mode notice
        run: |
          echo "Paper Monitor Build: LOCAL-2026.08.19-V2"
          echo "Publisher fetching is disabled on GitHub-hosted runners."
          echo "Run update_papers.bat on the configured local computer instead."

name: Update online papers

on:
  workflow_dispatch:
  schedule:
    # Approximately every other day at 02:17 UTC.
    - cron: "17 2 */2 * *"

# Manual button updates and scheduled updates share the same database.
# Serializing runs prevents two refreshes from writing papers.db at the same time.
concurrency:
  group: online-papers-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r paper-monitor-requirements.txt

      - name: Fetch and export
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
          DATABASE_URL: sqlite:///data/papers.db
          OVERLAP_DAYS: "3"
          EXPORT_DAYS: "365"
        run: python -m app.sync --provider all --initial-days 7

      - name: Commit database and website data
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.db paper-monitor/data/online_papers.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update online papers"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
